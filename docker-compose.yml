services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes: ["qdrant_data:/qdrant/storage"]
    ports: ["6333:6333"]
  app:
    build: .
    depends_on: [qdrant]
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
volumes:
  qdrant_data:
